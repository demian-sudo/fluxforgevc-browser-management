name: Offline policy validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate policy examples
        shell: pwsh
        run: |
          $report = ./src/Invoke-FluxForgePolicyValidation.ps1 -OutputDirectory $env:RUNNER_TEMP
          if (-not $report.isValid) {
            throw "Policy validation failed. See report at $($report.jsonReportPath)"
          }
      - name: Run offline tests
        shell: pwsh
        run: ./tests/Test-FluxForgePolicyFoundation.ps1
